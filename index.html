<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营数据看板</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <div class="dashboard">
        <aside class="sidebar glass">
            <div class="sidebar-header">
                <h2>运营数据看板</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">
                    <span class="nav-icon">01</span>
                    <span>仪表板</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">02</span>
                    <span>数据管理</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">03</span>
                    <span>报表中心</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="nav-icon">04</span>
                    <span>系统设置</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-bar glass">
                <div class="top-bar-left">
                    <h1>数据概览</h1>
                    <button class="refresh-btn" onclick="refreshData()" title="刷新数据">刷新</button>
                </div>
                <div class="top-bar-right">
                    <button class="theme-toggle" id="theme-toggle" title="切换主题">
                        <span class="icon">🌙</span>
                    </button>
                    <span class="notification">演示数据</span>
                    <div class="avatar">D</div>
                    <span>Demo</span>
                </div>
            </header>

            <div class="stats-cards">
                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #2563eb 0%, #0891b2 100%);">UV</div>
                    <div class="stat-info">
                        <div class="stat-label">活跃用户</div>
                        <div class="stat-value" id="total-users">0</div>
                        <div class="stat-change positive">↑ 12.5%</div>
                    </div>
                </div>

                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);">¥</div>
                    <div class="stat-info">
                        <div class="stat-label">成交金额</div>
                        <div class="stat-value" id="total-revenue">¥0</div>
                        <div class="stat-change positive">↑ 8.2%</div>
                    </div>
                </div>

                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #334155 0%, #0f172a 100%);">ORD</div>
                    <div class="stat-info">
                        <div class="stat-label">订单数量</div>
                        <div class="stat-value" id="total-orders">0</div>
                        <div class="stat-change positive">↑ 23.1%</div>
                    </div>
                </div>

                <div class="stat-card glass-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #16a34a 0%, #0891b2 100%);">SKU</div>
                    <div class="stat-info">
                        <div class="stat-label">SKU 数量</div>
                        <div class="stat-value" id="total-products">0</div>
                        <div class="stat-change negative">↓ 3.4%</div>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-card glass-card">
                    <div class="chart-header">
                        <h3>销售趋势</h3>
                        <select class="chart-filter" id="salesFilter" onchange="updateSalesChart()">
                            <option value="7">最近 7 天</option>
                            <option value="30">最近 30 天</option>
                            <option value="90">最近 90 天</option>
                        </select>
                    </div>
                    <canvas id="salesChart"></canvas>
                </div>

                <div class="chart-card glass-card">
                    <div class="chart-header">
                        <h3>用户分布</h3>
                    </div>
                    <canvas id="userChart"></canvas>
                </div>

                <div class="chart-card glass-card">
                    <div class="chart-header">
                        <h3>订单状态</h3>
                    </div>
                    <canvas id="orderChart"></canvas>
                </div>

                <div class="chart-card glass-card">
                    <div class="chart-header">
                        <h3>产品类别</h3>
                    </div>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="recent-orders glass-card">
                <div class="section-header">
                    <h3>最近订单</h3>
                    <button class="btn-view-all" onclick="viewAllOrders()">查看全部 →</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>客户</th>
                                <th>金额</th>
                                <th>状态</th>
                                <th>日期</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
